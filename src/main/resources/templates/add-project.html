<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Add project page')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="p-4 flex-grow-1">
    <div class="container card p-4 mt-4 text-bg-light">

        <h1>Create project</h1>
        <p class="text-muted">Fill out the fields below to create a project.</p>

        <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <hr>

        <form action="#" th:action="@{/addProject}" th:object="${project}" method="post">
            <div class="mb-3">
                <label class="form-label" for="name"><b>Name of project</b></label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="startdate"><b>Start date of project</b></label>
                <input type="date" id="startdate" th:field="*{{startdate}}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label" for="deadline"><b>Project deadline</b></label>
                <input type="date" id="deadline" th:field="*{{deadline}}" class="form-control">
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Create Project</button>
                <a class="btn btn-secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>

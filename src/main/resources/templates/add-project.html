<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Ad project page')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="p-4 flex-grow-1">
<span th:if="${errorMessage != null}" th:text="${errorMessage}" style="color:red"></span>
<form action="#" th:action="@{/addProject}" th:object="${project}" method="post">
    <label for="name">Name of project</label>
    <input type="text" id="name" th:field="*{name}">
    <label for="startdate">Start date of project</label>
    <input type="date" id="startdate" th:field="*{{startdate}}">
    <label for="deadline">Project deadline</label>
    <input type="date" id="deadline" th:field="*{{deadline}}">
    <button type="submit">Create Project</button>
</form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Employee Page')}"></head>
<body class="d-flex">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="p-4 flex-grow-1">
    <div class="container card p-4">
    <h1>Employee page</h1>
    <a th:href="@{/employee/create}" class="btn btn-primary mb-3">Add Employee</a>
    <table class="table">
        <tr>
            <th>Name</th>
            <th>Hourly/Rate</th>
            <th>Skills</th>
            <th>Actions</th>
        </tr>
        <tr th:each="employee: ${session.employees}">
            <td th:text="${employee.employeeName}"></td>
            <td th:text="${#numbers.formatInteger(employee.getHourlyPayRate(), 1)}"></td>
            <td th:text="${employee.getSkills().isEmpty() ? 'No skills' : employee.getSkillsAsString()}"></td>
            <td>
                <a class="btn btn-primary" th:href="@{/employee/{employeeId}/edit(employeeId=${employee.getEmployeeID()})}">Edit</a>
                <form action="#" method="post" th:action="@{/employee/delete/{employeeId}(employeeId=${employee.getEmployeeID()})}">
                    <button type="submit" class="btn btn-danger btn-lm mt-3">Delete</button>
                </form>

            </td>
        </tr>
    </table>
    </div>
</main>

</body>
</html>

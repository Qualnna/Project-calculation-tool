<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('View Assignment Page')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="p-4 flex-grow-1">
    <div class="container card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="'Task: ' + ${task.taskName}"></h1>
            <a class="btn btn-outline-secondary"
               th:href="@{/readProjectInfo/{subProjectID}/tasks(subProjectID=${subProjectID})}">
                ← Back to tasks
            </a>
        </div>
        <p class="text-muted fst-italic" th:if="${task.assignments.isEmpty()}">
            No one has been assigned to this task yet.
        </p>
        <table class="table" th:unless="${task.assignments.isEmpty()}">
            <thead>
            <tr>
                <th>Assigned Employee(s)</th>
                <th>Skills</th>
                <th>Time spent</th>
                <th>Est. completion</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${task.assignments}">
                <td th:text="${assignment.assignedEmployee.employeeName}"></td>
                <td>
                        <span th:if="${assignment.assignedEmployee.skills.isEmpty()}"
                              class="badge bg-secondary">No skills listed</span>
                    <span th:each="skill : ${assignment.assignedEmployee.skills}"
                          class="badge bg-info text-dark me-1"
                          th:text="${skill}">
                        </span>
                </td>
                <td th:text="${assignment.timeSpent + ' hr'}"></td>
                <td th:text="${assignment.completionDate}"></td>
            </tr>
            </tbody>
        </table>

    </div>
</main>
</body>
</html>

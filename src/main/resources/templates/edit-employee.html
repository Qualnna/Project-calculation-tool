<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Edit Employee Page')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="p-4 flex-grow-1">
<form action="#" th:action="@{/employee/update}" th:object="${employee}" method="post">
<div class="container card p-4  text-bg-light">
        <h1>Edit Employee</h1>
        <p class="text-muted">Update the employee details below.</p>
        <hr>


    <div class="mb-3">
        <input type="hidden" th:field="*{employeeID}">
        <label for="name"><b>Employee Name</b></label>
        <input type="text"  th:field="${employee.employeeName}" id="name" required class="form-control">
        </div>

    <div class="mb-3">
        <label for="hourly_rate" class="mb-3"><b>Hourly rate</b></label>
        <input th:field="*{hourlyPayRate}" type="number"  id="hourly_rate" required class="form-control">
        <br>
        <br>
        </div>

    <div class="mb-3" th:each="skill : ${skills}">
        <label>
            <!--            I use the #lists expression on line 31 from thymeleaf here to use the contains method-->
            <input type="checkbox"
                   class="form-check-input"
                   th:value="${skill}"
                   name="skills" 
                   th:checked="${employee.getSkills() != null && #lists.contains(employee.getSkills(), skill)}"/>
        </label>
        <label th:text="${skill}"></label>
    </div>
    </div>
    <hr>

    <button type="submit" class="btn btn-primary">Edit employee</button>
    <a class="btn btn-secondary" th:href="@{/employees}">Cancel</a>
</form>
</main>

</body>
</html>
